# Bộ nhớ cho Gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# KHÔNG dùng AndroidX / Jetifier (Android SDK thuần, zero dependency)
android.useAndroidX=false
android.enableJetifier=false

# R class không bắc cầu -> build nhanh hơn, R.java gọn hơn
android.nonTransitiveRClass=true
android.javaCompile.suppressSourceTargetDeprecationWarning=true
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,JAVA_COMPILE_DEPRECATED_SOURCE_TARGET
org.gradle.problems.report=false


